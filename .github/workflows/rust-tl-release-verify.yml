name: Release verification
on:
  pull_request:
    paths: ['rust/tl-release-verify/**', '_book/RELEASES.sha256', '_book/*.exe', '_book/*.zip', '.github/workflows/rust-tl-release-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked dependencies
        working-directory: rust/tl-release-verify
        run: cargo fetch --locked
      - name: Unit and contract tests
        working-directory: rust/tl-release-verify
        run: cargo test --locked --offline
      - name: Lint all targets
        working-directory: rust/tl-release-verify
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Verify committed formatting
        working-directory: rust/tl-release-verify
        run: cargo fmt --all -- --check
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        working-directory: rust/tl-release-verify/lean
        run: lake build
      - name: Reject sorry/admit
        working-directory: rust/tl-release-verify/lean
        run: "! grep -rnE '(^|[^A-Za-z_.])sorry([^A-Za-z_]|$)|^[[:space:]]*admit[[:space:]]*$' --include=*.lean ."
      - name: Axiom audit
        working-directory: rust/tl-release-verify/lean
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          ! grep -q sorryAx axioms.txt
